<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة الروابط الخاصّة بي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            perspective: 1000px;
        }

        /* شاشة التحميل */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .loader-bar {
            width: 200px;
            height: 4px;
            background: #222;
            margin-top: 15px;
            border-radius: 2px;
            overflow: hidden;
        }

        .loader-progress {
            width: 0%;
            height: 100%;
            background: #00ffcc;
            transition: width 0.2s ease;
        }

        /* البطاقة الرئيسية */
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid #00ffcc;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #00ffcc;
            font-size: 0.85rem;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        /* الروابط */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 20px;
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .link-btn:hover {
            background: rgba(0, 255, 204, 0.15);
            border-color: #00ffcc;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 255, 204, 0.2);
        }

        .link-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.75rem;
            color: #666;
        }
    </style>
</head>
<body>

    <!-- Loader -->
    <div id="loader">
        <h2>LOADING...</h2>
        <div class="loader-bar">
            <div class="loader-progress" id="progress"></div>
        </div>
        <p id="percent" style="margin-top: 10px; font-size: 0.8rem; color: #888;">0%</p>
    </div>

    <!-- Main Content -->
    <div class="card" id="card">
        <img src="https://via.placeholder.com/90" alt="Logo" class="profile-img">
        <h1>YOUR NAME</h1>
        <div class="subtitle">GAMING • CREATOR • ONLINE</div>

        <div class="links-container">
            <a href="https://discord.gg/" target="_blank" class="link-btn">
                <div class="link-info">
                    <span>🎮</span>
                    <div>
                        <div style="font-weight: bold;">FiveM Server</div>
                        <div style="font-size: 0.75rem; color: #aaa;">Discord Community</div>
                    </div>
                </div>
                <span>←</span>
            </a>

            <a href="https://tiktok.com/" target="_blank" class="link-btn">
                <div class="link-info">
                    <span>♪</span>
                    <div>
                        <div style="font-weight: bold;">TikTok</div>
                        <div style="font-size: 0.75rem; color: #aaa;">@username</div>
                    </div>
                </div>
                <span>←</span>
            </a>

            <a href="https://github.com/" target="_blank" class="link-btn">
                <div class="link-info">
                    <span>⌘</span>
                    <div>
                        <div style="font-weight: bold;">GitHub</div>
                        <div style="font-size: 0.75rem; color: #aaa;">your-username</div>
                    </div>
                </div>
                <span>←</span>
            </a>
        </div>

        <div class="footer">
            © 2026 YOUR BRAND // ALL RIGHTS RESERVED
        </div>
    </div>

    <script>
        // محاكاة شاشة التحميل (Loader)
        let percent = 0;
        const progress = document.getElementById('progress');
        const percentText = document.getElementById('percent');
        const loader = document.getElementById('loader');

        const interval = setInterval(() => {
            percent += 5;
            progress.style.width = percent + '%';
            percentText.innerText = percent + '%';

            if (percent >= 100) {
                clearInterval(interval);
                setTimeout(() => {
                    loader.style.opacity = '0';
                    loader.style.visibility = 'hidden';
                }, 300);
            }
        }, 50);

        // تأثير تحريك الماوس الـ 3D (3D Tilt Effect)
        const card = document.getElementById('card');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
    </script>
</body>
</html>
